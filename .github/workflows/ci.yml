name: CI
on:
  push:
    branches:
    - master
    - stable
  pull_request:
  workflow_dispatch:
jobs:
  build:
    env:
      GH_TOKEN: ${{ github.token }}
      GCST_WERROR: ON
      PYTHONPATH: ${{ github.workspace }}/.gcst
    strategy:
      fail-fast: false
      matrix:
        include:
        - preset: unix-clang-libc++
          os: ubuntu-latest
          build: sh build.sh
        - preset: unix-clang-libstdc++
          os: ubuntu-latest
          build: sh build.sh
        - preset: win64-clang-libstdc++
          os: windows-latest
          build: ./build.bat
        - preset: win64-clang-msvc
          os: windows-latest
          build: ./build.bat
        - preset: unix-gcc-libstdc++
          os: ubuntu-latest
          build: sh build.sh
        - preset: win64-gcc-libstdc++
          os: windows-latest
          build: ./build.bat
        - preset: win64-msvc-msvcstl
          os: windows-latest
          build: ./build.bat
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install conan ruamel.yaml
    - uses: actions/checkout@v4
    - run: conan profile detect --force
    - run: python .gcst/scripts/configure.py
    - run: git diff --exit-code .github/workflows/ci.yml
    - name: Restore Conan cache
      id: conan-cache
      uses: actions/cache/restore@v4
      with:
        path: conan-cache.tgz
        key: conan2-${{ matrix.preset }}-${{ hashFiles('conanfile.py', 
          format('conan/profiles/{0}', matrix.preset), 'recipes/**') }}
        restore-keys: conan2-${{ matrix.preset }}
    - name: Unpack Conan cache
      if: steps.conan-cache.outputs.cache-matched-key != ''
      run: conan cache restore conan-cache.tgz
    - if: ${{ matrix.preset == 'unix-clang-libc++' }}
      run: |+
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 19 all
        sudo apt update
        sudo apt install -y libc++-19-dev libc++abi-19-dev

        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-19   1000
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 1000
        sudo update-alternatives --set clang   /usr/bin/clang-19
        sudo update-alternatives --set clang++ /usr/bin/clang++-19
        clang --version

    - if: ${{ matrix.preset == 'unix-clang-libstdc++' }}
      run: |+
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 19 all
        sudo apt update
        sudo apt install -y libc++-19-dev libc++abi-19-dev

        sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-19   1000
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 1000
        sudo update-alternatives --set clang   /usr/bin/clang-19
        sudo update-alternatives --set clang++ /usr/bin/clang++-19
        clang --version

        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt update
        sudo apt install -y g++-16
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100

    - shell: pwsh
      if: ${{ matrix.preset == 'win64-clang-libstdc++' }}
      run: |+
        $PSNativeCommandUseErrorActionPreference = $true

        if ("19.1.7" -eq "latest") {
            $tag = gh release view -R mstorsjo/llvm-mingw --json tagName --jq .tagName
        } else {
            $re = "with LLVM $([regex]::Escape("19.1.7"))( final)?$"
            $tag = (
                gh release list -R mstorsjo/llvm-mingw -L 1000 --json tagName,name |
                ConvertFrom-Json |
                Where-Object { $_.name -match $re } |
                Select-Object -First 1
            ).tagName
        }

        if (-not $tag) {
            throw "No llvm-mingw release with LLVM 19.1.7"
        }

        Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/llvm-mingw-$tag-ucrt-x86_64.zip" -OutFile llvm-mingw.zip
        tar -xf llvm-mingw.zip -C C:\
        "C:\llvm-mingw-$tag-ucrt-x86_64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.44'
      if: ${{ matrix.preset == 'win64-clang-msvc' }}
    - if: ${{ matrix.preset == 'win64-clang-msvc' }}
      run: |+
        $PSNativeCommandUseErrorActionPreference = $true

        if ("19.1.7" -eq "latest") {
            $tag = gh release view -R llvm/llvm-project --json tagName --jq .tagName
        } else {
            $tag = "llvmorg-19.1.7"
        }
        $ver  = $tag -replace '^llvmorg-', ''
        $name = "clang+llvm-$ver-x86_64-pc-windows-msvc"

        Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/$tag/$name.tar.xz" -OutFile llvm.tar.xz
        cmd /c "7z x llvm.tar.xz -so | 7z x -si -ttar -oC:\ -y"
        Move-Item "C:\$name" C:\LLVM
        "C:\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

    - if: ${{ matrix.preset == 'unix-gcc-libstdc++' }}
      run: |+
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt update
        sudo apt install -y g++-16
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100

    - shell: pwsh
      if: ${{ matrix.preset == 'win64-gcc-libstdc++' }}
      run: |+
        $PSNativeCommandUseErrorActionPreference = $true

        choco install mingw --version=16.1.0 -y
        echo "C:\ProgramData\mingw64\mingw64\bin" >> $env:GITHUB_PATH

    - uses: ilammy/msvc-dev-cmd@v1
      with:
        toolset: '14.44'
      if: ${{ matrix.preset == 'win64-msvc-msvcstl' }}
    - name: Build
      run: ${{ matrix.build }} --preset ${{ matrix.preset }}
    - name: Log results
      if: always()
      shell: bash
      run: echo "${{ matrix.preset }} ${{ job.status }}" > r-${{ matrix.preset 
        }}.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ci-result-${{ matrix.preset }}
        path: r-${{ matrix.preset }}.txt
    - name: Pack Conan cache
      if: "!cancelled() && steps.conan-cache.outputs.cache-hit != 'true' && hashFiles('build/conan_toolchain.cmake')
        != ''"
      run: conan list --graph=build/graph.json --format=json 
        --out-file=pkglist.json && conan cache save --list=pkglist.json 
        --file=conan-cache.tgz
    - name: Save Conan cache
      if: "!cancelled() && steps.conan-cache.outputs.cache-hit != 'true' && hashFiles('build/conan_toolchain.cmake')
        != ''"
      uses: actions/cache/save@v4
      with:
        path: conan-cache.tgz
        key: ${{ steps.conan-cache.outputs.cache-primary-key }}
  notes:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: ci-result-*
        merge-multiple: true
        path: results
    - name: Record notes
      run: |
        { printf '\n— Builds with:\n'
          cat results/*.txt | tr -d '\r' | sort \
            | awk '{ printf " - %-24s %s\n", $1, ($2=="success" ? "✓" : ($2=="failure" ? "✗" : "? ("$2")")) }'
        } > verdict.txt
        ls -la results/
        echo "--- collected ---"
        cat results/*.txt
        echo "--- verdict ---"
        cat verdict.txt
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git fetch origin "refs/notes/ci:refs/notes/ci" || true
        git notes --ref=ci add -f --no-stripspace -F verdict.txt ${{ github.sha }}
        git push origin refs/notes/ci
